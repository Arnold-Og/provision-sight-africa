[build]
  publish = "dist"
  command = "npm run build"

# Optional: domain redirect (alternative to public/_redirects)
# [[redirects]]
#   from = "/*"
#   to = "https://provisionsightafrica.com/:splat"
#   status = 301
#   force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
